name: Build Starforge Crawler Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android-apk:
    name: Export Android Debug APK (Godot 4.3)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize OpenJDK, Android SDK, Debug Keystore & Godot 4.3 Settings
        run: |
          set -e

          # 1. Locate pre-installed OpenJDK
          JAVA_SDK=""
          for candidate in \
            "${JAVA_HOME:-}" \
            "/usr/lib/jvm/java-17-openjdk-amd64" \
            "/usr/lib/jvm/java-21-openjdk-amd64" \
            "/usr/lib/jvm/default-java"
          do
            if [ -n "$candidate" ] && [ -d "$candidate" ] && [ -x "$candidate/bin/java" ]; then
              JAVA_SDK="$(readlink -f "$candidate")"
              break
            fi
          done

          if [ -z "$JAVA_SDK" ] && command -v javac >/dev/null 2>&1; then
            JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi

          if [ -z "$JAVA_SDK" ] || [ ! -d "$JAVA_SDK" ]; then
            echo "ERROR: No valid OpenJDK found in container."
            ls -la /usr/lib/jvm/ || true
            exit 1
          fi

          # 2. Locate Android SDK
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          if [ ! -d "$ANDROID_SDK" ]; then
            for sdk_cand in "/usr/lib/android-sdk" "/root/android-sdk" "/opt/android-sdk"; do
              if [ -d "$sdk_cand" ]; then
                ANDROID_SDK="$sdk_cand"
                break
              fi
            done
          fi

          # 3. Generate debug.keystore inside workspace so path is 100% deterministic
          KEYSTORE_PATH="$PWD/debug.keystore"
          KEYTOOL_BIN="$JAVA_SDK/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN="$(command -v keytool)"
          fi

          rm -f "$KEYSTORE_PATH"
          "$KEYTOOL_BIN" -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # 4. Prepare isolated XDG data & config directories (eliminates /root vs /github/home mismatch)
          mkdir -p "$PWD/.godot_data/godot" "$PWD/.godot_config/godot" "$HOME/.local/share/godot" "$HOME/.config/godot"
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            ln -sfn /root/.local/share/godot/export_templates "$PWD/.godot_data/godot/export_templates"
            ln -sfn /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          fi

          # 5. Write clean Godot 4.3 EditorSettings into every possible config location
          for CFG_DIR in "$PWD/.godot_config/godot" "$HOME/.config/godot" "/root/.config/godot"; do
            mkdir -p "$CFG_DIR" 2>/dev/null || continue
            for FNAME in "editor_settings-4.3.tres" "editor_settings-4.tres"; do
              cat <<EOF > "$CFG_DIR/$FNAME"
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_SDK"
export/android/android_sdk_path = "$ANDROID_SDK"
export/android/debug_keystore = "$KEYSTORE_PATH"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
            done
          done

          # 6. Also write keystore options directly into export_presets.cfg as a second guarantee
          sed -i '/^keystore\/debug/d' export_presets.cfg
          cat <<EOF >> export_presets.cfg
keystore/debug="$KEYSTORE_PATH"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
EOF

          echo "=== VERIFIED ANDROID BUILD CONFIG ==="
          echo "JAVA_SDK=$JAVA_SDK"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH"
          cat "$PWD/.godot_config/godot/editor_settings-4.3.tres"

      - name: Import project resources headlessly
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.godot_config
          XDG_DATA_HOME: ${{ github.workspace }}/.godot_data
        run: |
          godot --headless --import --quit || true

      - name: Export signed Debug APK
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.godot_config
          XDG_DATA_HOME: ${{ github.workspace }}/.godot_data
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/starforge-crawler.apk
          ls -lh build/android/starforge-crawler.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: starforge-crawler-vs1-apk
          path: build/android/starforge-crawler.apk
          retention-days: 30
